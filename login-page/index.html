<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحه ورود مدرن و امن حساب کاربری برای سامانه‌های ابری و SaaS">
  <meta name="theme-color" content="#F7F9FC">
  <title>ورود به حساب کاربری</title>

  <!-- Web fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Project styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Project scripts -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient-blob blob-top-start" aria-hidden="true"></div>
  <div class="ambient-blob blob-bottom-end" aria-hidden="true"></div>

  <aside class="top-controls" aria-label="تنظیمات پوسته">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="تغییر حالت شب و روز">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </aside>

  <main class="page-wrapper">
    <div class="login-container">
      <section class="login-card" aria-labelledby="loginHeading">
        <header class="card-header">
          <div class="brand-logo" aria-hidden="true">
            <span>پنل ثبت نام</span>
          </div>
          <h1 id="loginHeading" class="card-title">ورود به حساب</h1>
          <p class="card-subtitle">برای ادامه وارد شوید</p>
        </header>

        <form id="loginForm" class="login-form" novalidate>
          <!-- Email field -->
          <div class="form-group" id="emailGroup">
            <label for="emailInput" class="form-label">آدرس ایمیل</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="emailInput"
                name="email"
                class="form-input"
                placeholder="example@email.com"
                autocomplete="email"
                required
                aria-describedby="emailError"
                aria-invalid="false"
              >
              <div class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
            </div>
            <div id="emailError" class="field-error-msg" role="alert" aria-live="polite">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
              </svg>
              <span class="error-text">لطفاً یک آدرس ایمیل معتبر وارد کنید</span>
            </div>
          </div>

          <!-- Password field -->
          <div class="form-group" id="passwordGroup">
            <label for="passwordInput" class="form-label">رمز عبور</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="passwordInput"
                name="password"
                class="form-input has-trailing-btn"
                placeholder="رمز عبور خود را وارد کنید"
                autocomplete="current-password"
                required
                aria-describedby="passwordError"
                aria-invalid="false"
              >
              <div class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <button
                type="button"
                id="togglePasswordBtn"
                class="trailing-btn"
                aria-label="نمایش رمز عبور"
                aria-pressed="false"
              >
                <svg id="eyeOpenIcon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeCloseIcon" viewBox="0 0 24 24" style="display: none;" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div id="passwordError" class="field-error-msg" role="alert" aria-live="polite">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
              </svg>
              <span class="error-text">رمز عبور باید حداقل ۶ کاراکتر باشد</span>
            </div>
          </div>

          <div class="form-options-row">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" name="remember" class="custom-checkbox-input">
              <span class="custom-checkbox-box" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              <span>مرا به خاطر بسپار</span>
            </label>
            <a href="#forgot" class="forgot-link" id="forgotPasswordLink">فراموشی رمز عبور</a>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span class="btn-text">ورود</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>

          <div class="divider" role="separator">
            <span class="divider-text">یا</span>
          </div>

          <div class="oauth-group">
            <button type="button" class="btn btn-outline" id="googleLoginBtn">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.02h3.87c2.27-2.09 3.675-5.17 3.675-9.12z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.02c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.28v3.12C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.61H1.28C.46 8.23 0 10.06 0 12s.46 3.77 1.28 5.39l3.99-3.12z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.28 6.61l3.99 3.12c.95-2.85 3.6-4.98 6.73-4.98z"/>
              </svg>
              <span>ورود با Google</span>
            </button>

            <button type="button" class="btn btn-outline" id="otpLoginBtn">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
              <span>ورود با کد یک‌ بار مصرف</span>
            </button>
          </div>

          <div class="signup-prompt">
            <span>حساب ندارید؟</span>
            <a href="#signup" class="signup-link" id="registerLink">ثبت‌ نام</a>
          </div>
        </form>
      </section>

      <footer class="page-footer" role="contentinfo">
        <a href="#privacy" class="footer-link" id="privacyLink">حریم خصوصی</a>
        <span class="footer-dot" aria-hidden="true"></span>
        <a href="#support" class="footer-link" id="supportLink">پشتیبانی</a>
      </footer>
    </div>
  </main>

  <div id="toastNotification" class="toast-container" role="status" aria-live="polite">
    <span id="toastMessage">پیام اطلاع‌رسانی</span>
  </div>
</body>
</html>
